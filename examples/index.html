<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuxIso — Examples</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07070d;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #888;
      padding: 48px 24px 72px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }
    .logo {
      font-size: 0.70rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #222230;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #ccc;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.76rem;
      color: #252535;
      letter-spacing: 0.06em;
    }

    /* ── Section headings ── */
    .section-heading {
      max-width: 1100px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .section-heading h2 {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #2a2a3a;
      white-space: nowrap;
    }
    .section-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #141420;
    }

    .section-gap { margin-bottom: 44px; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Tools row — 2 columns max, wider cards */
    .grid-tools {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Card ── */
    .card {
      background: #0c0c14;
      border: 1px solid #141420;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      border-color: #2a2a4a;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(80,100,200,0.08);
    }
    .card.tool-card {
      border-color: #181828;
    }
    .card.tool-card:hover {
      border-color: #3a3a60;
      box-shadow: 0 8px 32px rgba(100,120,220,0.10);
    }

    .card-preview {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      position: relative;
      overflow: hidden;
    }
    .card-body {
      padding: 14px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .card-num {
      font-size: 0.60rem;
      letter-spacing: 0.20em;
      color: #1e1e2e;
      font-family: monospace;
    }
    .card-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: #bbb;
      letter-spacing: 0.03em;
    }
    .card-desc {
      font-size: 0.70rem;
      color: #2e2e40;
      line-height: 1.65;
      margin-top: 2px;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .tag {
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      padding: 2px 6px;
      border-radius: 10px;
      border: 1px solid #1a1a28;
      color: #282840;
      background: #0e0e18;
    }
    .tag.tool-tag {
      border-color: #222240;
      color: #3a3a60;
    }

    /* Preview backgrounds */
    .bg-01   { background: linear-gradient(135deg, #0a1020 0%, #1a2840 100%); }
    .bg-02   { background: linear-gradient(135deg, #0a1a10 0%, #1a3020 100%); }
    .bg-03   { background: linear-gradient(135deg, #1a0a10 0%, #301020 100%); }
    .bg-04   { background: linear-gradient(135deg, #0a0a1a 0%, #1a1a30 100%); }
    .bg-05   { background: linear-gradient(135deg, #0a1408 0%, #1a2a10 50%, #0a0a1a 100%); }
    .bg-06   { background: linear-gradient(135deg, #020508 0%, #040c14 50%, #060f1c 100%); }
    .bg-07   { background: linear-gradient(135deg, #1a0e04 0%, #3a2008 50%, #1a0a00 100%); }
    .bg-08   { background: linear-gradient(135deg, #0d0503 0%, #2a0a04 50%, #4a1a08 100%); }
    .bg-09   { background: linear-gradient(135deg, #081408 0%, #142814 50%, #0a1e0a 100%); }
    .bg-main { background: linear-gradient(135deg, #0a0a0f 0%, #141428 100%); }
    .bg-scene-editor  { background: linear-gradient(135deg, #080810 0%, #10102a 50%, #0a0a1a 100%); }
    .bg-sprite-editor { background: linear-gradient(135deg, #080c10 0%, #0c1828 50%, #080c18 100%); }

    /* Animated dots */
    .preview-dots { position: absolute; inset: 0; overflow: hidden; }
    .dot {
      position: absolute;
      border-radius: 50%;
      animation: float linear infinite;
      opacity: 0;
    }
    @keyframes float {
      0%   { transform: translateY(0) scale(1);    opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-110px) scale(0.3); opacity: 0; }
    }

    footer {
      text-align: center;
      margin-top: 60px;
      font-size: 0.63rem;
      color: #181828;
      letter-spacing: 0.1em;
    }
    footer a { color: #222238; text-decoration: none; }
    footer a:hover { color: #44446a; }
  </style>
</head>
<body>

<header>
  <div class="logo">LuxIso Engine</div>
  <h1>Examples &amp; Tools</h1>
  <div class="subtitle">Isometric rendering · Canvas 2D · TypeScript</div>
</header>

<!-- ── Tools ─────────────────────────────────────────────────────────────── -->

<div class="section-heading"><h2>Tools</h2></div>
<div class="grid-tools section-gap" id="grid-tools"></div>

<!-- ── Examples ──────────────────────────────────────────────────────────── -->

<div class="section-heading"><h2>Examples</h2></div>
<div class="grid section-gap" id="grid-examples"></div>

<!-- ── Engine Demo ────────────────────────────────────────────────────────── -->

<div class="section-heading"><h2>Engine Demo</h2></div>
<div class="grid-tools" id="grid-main"></div>

<footer>
  <a href="https://github.com/dreamsxin/LuxIso" target="_blank">LuxIso</a> &nbsp;·&nbsp; Canvas 2D Isometric Engine &nbsp;·&nbsp; TypeScript
</footer>

<script>
  // ── Single source of truth for all gallery cards ──────────────────────────
  // Each entry renders one card. Keeping the list data-driven prevents the
  // duplicate-card / href-drift / missing-dots problems that arose when cards
  // were hand-duplicated static HTML.
  //
  // `dotsId` keys into DOTS below for the animated floating-dot colors/count.
  const SECTIONS = [
    {
      gridId: 'grid-tools',
      tool: true,
      cards: [
        {
          href: '/editor.html', bg: 'bg-scene-editor', dotsId: 'dots-scene-editor',
          num: 'TOOL', emoji: '🛠️', title: 'Scene Editor',
          desc: 'Visual editor for building isometric scenes. Place floors, walls, lights, characters and props, then export to JSON for use in your game.',
          tags: ['Editor', 'JSON Export', 'Undo / Redo', 'Props', 'Lighting'],
        },
        {
          href: '/sprite-editor.html', bg: 'bg-sprite-editor', dotsId: 'dots-sprite-editor',
          num: 'TOOL', emoji: '🎨', title: 'Sprite Editor',
          desc: 'Configure sprite sheet animations. Define action clips, set frame size and FPS, preview all 8 directions, then export a SpriteSheet JSON config.',
          tags: ['Sprite Sheet', 'Animation', '8-Direction', 'JSON Export'],
        },
      ],
    },
    {
      gridId: 'grid-examples',
      tool: false,
      cards: [
        {
          href: '/examples/01-minimal-scene/', bg: 'bg-01', dotsId: 'dots-01',
          num: '01', emoji: '🗺️', title: 'Minimal Scene',
          desc: 'Basic isometric scene setup with floor tiles, walls, and a single light source.',
          tags: ['Scene', 'Floor', 'Lighting'],
        },
        {
          href: '/examples/02-character-movement/', bg: 'bg-02', dotsId: 'dots-02',
          num: '02', emoji: '🎮', title: 'Character Movement',
          desc: 'WASD keyboard control, collision detection, and smooth camera follow.',
          tags: ['Input', 'Collision', 'Camera'],
        },
        {
          href: '/examples/03-combat-system/', bg: 'bg-03', dotsId: 'dots-03',
          num: '03', emoji: '⚔️', title: 'Combat System',
          desc: 'Health components, damage events, floating text, and particle effects on hit.',
          tags: ['ECS', 'Particles', 'Events'],
        },
        {
          href: '/examples/04-hud-debug-inputmap/', bg: 'bg-04', dotsId: 'dots-04',
          num: '04', emoji: '🖥️', title: 'HUD · Debug · InputMap',
          desc: 'Canvas-space HUD layer, debug renderer overlay, and action-based input mapping.',
          tags: ['HUD', 'Debug', 'InputMap'],
        },
        {
          href: '/examples/05-whisper-plains/', bg: 'bg-05', dotsId: 'dots-05',
          num: '05', emoji: '🌿', title: 'Whisper Plains',
          desc: 'Full demo: day/night cycle, multi-scene teleportation, animals, voxel lake, deep sea.',
          tags: ['Day/Night', 'Multi-Scene', 'Particles', 'Animals'],
        },
        {
          href: '/examples/06-voxel-lake/', bg: 'bg-06', dotsId: 'dots-06',
          num: '06', emoji: '🌊', title: 'Voxel Lake',
          desc: 'Hundreds of animated voxel cubes forming a dynamic wave simulation with seabed decor.',
          tags: ['Voxel', 'Wave Sim', 'Procedural'],
        },
        {
          href: '/examples/07-desert-ruins/', bg: 'bg-07', dotsId: 'dots-07',
          num: '07', emoji: '🏜️', title: 'Desert Ruins',
          desc: '沙漠遗迹：低多边形沙丘、金字塔、仙人掌、石碑交互、传送阵与宝箱机关。',
          tags: ['Terrain', 'Interaction', 'Particles', 'Portal'],
        },
        {
          href: '/examples/08-volcano/', bg: 'bg-08', dotsId: 'dots-08',
          num: '08', emoji: '🌋', title: 'Volcano Lava Zone',
          desc: '火山熔岩地带：岩层地面、火山锥、熔岩河流、烟雾粒子、裂缝喷发与灼烧伤害机制。',
          tags: ['Terrain', 'Particles', 'Damage', 'Voxel'],
        },
        {
          href: '/examples/09-slopes/', bg: 'bg-09', dotsId: 'dots-09',
          num: '09', emoji: '🏔️', title: 'Slopes & Terrain Height',
          desc: 'HeightMap with per-corner heights, sloped floor rendering with cliff faces, smooth voxel hills, and character Z following terrain via bilinear interpolation.',
          tags: ['HeightMap', 'Slopes', 'Terrain', 'Bilinear'],
        },
      ],
    },
    {
      gridId: 'grid-main',
      tool: false,
      cards: [
        {
          href: '/', bg: 'bg-main', dotsId: 'dots-main',
          num: 'MAIN', emoji: '🎯', title: 'Interactive Engine Demo',
          desc: 'Full-featured demo showcasing lighting controls, A* pathfinding, minimap, camera view presets, and scene JSON loading.',
          tags: ['Pathfinding', 'Minimap', 'IsoView', 'Lighting', 'JSON Scene'],
        },
      ],
    },
  ];

  const DOTS = {
    'dots-scene-editor':  { colors: ['#4455aa','#6677cc','#8899dd'], count: 8 },
    'dots-sprite-editor': { colors: ['#2255aa','#3377cc','#4499dd'], count: 8 },
    'dots-01': { colors: ['#3060a0','#2050c0','#4080d0'], count: 7 },
    'dots-02': { colors: ['#306030','#408040','#50a050'], count: 7 },
    'dots-03': { colors: ['#a03030','#c04040','#d06060'], count: 7 },
    'dots-04': { colors: ['#303080','#4040a0','#6060c0'], count: 7 },
    'dots-05': { colors: ['#306030','#4080a0','#8040c0'], count: 9 },
    'dots-06': { colors: ['#1040a0','#2060c0','#00a0c0'], count: 9 },
    'dots-07': { colors: ['#c08020','#e0a030','#a06010'], count: 9 },
    'dots-08': { colors: ['#ff4400','#ff8800','#cc2200'], count: 11 },
    'dots-09': { colors: ['#306030','#508050','#204020'], count: 9 },
    'dots-main': { colors: ['#404060','#505080','#6060a0'], count: 9 },
  };

  // ── Render cards from data ────────────────────────────────────────────────
  function renderCards(section) {
    const grid = document.getElementById(section.gridId);
    if (!grid) return;
    for (const c of section.cards) {
      const card = document.createElement('a');
      card.className = 'card' + (section.tool ? ' tool-card' : '');
      card.href = c.href;

      const tagClass = section.tool ? 'tag tool-tag' : 'tag';
      const tagsHtml = c.tags.map(t => `<span class="${tagClass}">${t}</span>`).join('');

      card.innerHTML =
        `<div class="card-preview ${c.bg}">
           <div class="preview-dots" id="${c.dotsId}"></div>
           <span>${c.emoji}</span>
         </div>
         <div class="card-body">
           <div class="card-num">${c.num}</div>
           <div class="card-title">${c.title}</div>
           <div class="card-desc">${c.desc}</div>
           <div class="card-tags">${tagsHtml}</div>
         </div>`;
      grid.appendChild(card);
    }
  }

  for (const section of SECTIONS) renderCards(section);

  // ── Animated dots (keyed by dotsId, now unique per card) ──────────────────
  for (const [id, cfg] of Object.entries(DOTS)) {
    const container = document.getElementById(id);
    if (!container) continue;
    for (let i = 0; i < cfg.count; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      const size = 3 + Math.random() * 5;
      dot.style.cssText = [
        `width:${size}px`, `height:${size}px`,
        `left:${5 + Math.random() * 90}%`,
        `top:${20 + Math.random() * 70}%`,
        `background:${cfg.colors[i % cfg.colors.length]}`,
        `animation-duration:${2 + Math.random() * 3}s`,
        `animation-delay:${Math.random() * 3}s`,
      ].join(';');
      container.appendChild(dot);
    }
  }
</script>

</body>
</html>
