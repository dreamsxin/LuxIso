name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dreamsxin/LuxIso'
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        run: >-
          node -e "const version=require('./package.json').version;
          const expected='v'+version;
          if(process.env.GITHUB_REF_NAME!==expected){
          console.error('Expected tag '+expected+', received '+process.env.GITHUB_REF_NAME);
          process.exit(1)}"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify source encodings
        run: npm run encoding:check

      - name: Build demos and editors
        run: npm run build

      - name: Build library package
        run: npm run build:lib

      - name: Smoke-test package entry points
        run: |
          node --input-type=module -e "import('./dist/luxiso.mjs').then(m => { if (!m.Engine || !m.Scene) process.exit(1) })"
          node -e "const m=require('./dist/luxiso.cjs'); if (!m.Engine || !m.Scene) process.exit(1)"

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish package to npm
        shell: bash
        env:
          # Required only for the first release. Remove the environment secret
          # after configuring npm Trusted Publishing for this workflow.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "Package version already exists on npm; skipping npm publish."
          else
            if [[ -n "$NPM_TOKEN" ]]; then
              export NODE_AUTH_TOKEN="$NPM_TOKEN"
            fi
            npm publish --access public --provenance
          fi

      - name: Build release archive
        id: archive
        shell: bash
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.archive.outputs.file }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.archive.outputs.file }}#npm package" \
              --verify-tag \
              --generate-notes \
              --title "LuxIso $GITHUB_REF_NAME"
          fi
