name: WebGL Preview

on:
  push:
    paths:
      - '.github/workflows/webgl-preview.yml'
      - 'src/**'
      - 'webgl-next/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.webgl.config.ts'
      - 'vite.config.ts'
  pull_request:
    paths:
      - '.github/workflows/webgl-preview.yml'
      - 'src/**'
      - 'webgl-next/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.webgl.config.ts'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  fixture-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Unit suite with the coverage ratchets in vitest.config.ts. Fails the job
      # if a correctness-critical module loses coverage.
      - run: npm run test:coverage
      # Runs `npm run build` first (see the test:webgl script), so the browser
      # suite exercises the production bundle via `vite preview`, and the build's
      # `tsc` doubles as the type-check gate.
      - run: npm run test:webgl
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/lcov.info
            coverage/index.html
          if-no-files-found: warn
          retention-days: 14
      - name: Upload golden candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-golden-candidates-${{ github.sha }}
          path: |
            test-results/webgl-next/**/*.png
            test-results/webgl-next/**/*.json
          if-no-files-found: warn
          retention-days: 14
